name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Assets
        run: |
          echo "📥 Downloading assets from original Psych Engine (~542MB)..."
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ShadowMario/FNF-PsychEngine.git _temp
          cd _temp && git sparse-checkout set assets && cd ..
          cp -r _temp/assets ./assets && rm -rf _temp
          du -sh assets/
      
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.2.5'
      
      - name: Setup Haxelib
        run: mkdir ~/haxelib && haxelib setup ~/haxelib
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Libraries
        run: |
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib install flxanimate --quiet
          haxelib install hscript-iris 1.1.3 --quiet
          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git --quiet || haxelib install linc_luajit --quiet
          haxelib install lime --quiet
          haxelib install openfl --quiet
      
      - name: Setup Lime
        run: haxelib run lime setup android
      
      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.build_type || 'release' }}" = "release" ]; then
            haxelib run lime build android -final
          else
            haxelib run lime build android -debug
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-Android
          path: export/**/*.apk
          if-no-files-found: warn