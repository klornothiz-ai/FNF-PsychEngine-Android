name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        default: release
        type: choice
        options: [release, debug]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: release
    steps:
      - uses: actions/checkout@v4
      - name: Get assets
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ShadowMario/FNF-PsychEngine.git _t
          cd _t && git sparse-checkout set assets && cd ..
          cp -r _t/assets ./assets && rm -rf _t
      - uses: krdlab/setup-haxe@v1
        with: { haxe-version: '4.2.5' }
      - run: mkdir -p ~/haxelib && haxelib setup ~/haxelib
      - uses: actions/setup-java@v4
        with: { java-version: '11', distribution: 'temurin' }
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r21e, link-to-sdk: true }
      - run: |
          echo ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }} >> $GITHUB_ENV
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib install flxanimate --quiet
          haxelib install hscript-iris 1.1.3 --quiet
          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git --quiet || haxelib install linc_luajit --quiet
          haxelib install lime --quiet
          haxelib install openfl --quiet
      - name: Build APK
        run: |
          echo NDK=$ANDROID_NDK_ROOT SDK=$ANDROID_SDK_ROOT
          haxelib run lime build android -final
      - uses: actions/upload-artifact@v4
        with: { name: PsychEngine-Android, path: 'export/**/*.apk', if-no-files-found: warn }