name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Assets
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ShadowMario/FNF-PsychEngine.git _t
          cd _t && git sparse-checkout set assets && cd ..
          cp -r _t/assets ./assets && rm -rf _t
          du -sh assets/
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;21.4.7075529'
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.2.5'
      - name: Setup Haxelib
        run: mkdir ~/haxelib && haxelib setup ~/haxelib
      - name: Install Libs
        run: |
          haxelib install flixel 5.6.1 --quiet; haxelib install flixel-addons 3.2.2 --quiet
          haxelib install tjson 1.4.0 --quiet; haxelib install flxanimate --quiet
          haxelib install hscript-iris 1.1.3 --quiet
          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git --quiet || haxelib install linc_luajit --quiet
          haxelib install lime --quiet; haxelib install openfl --quiet
      - name: Build APK
        run: |
          BT="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BT" = "release" ]; then haxelib run lime build android -final
          else haxelib run lime build android -debug; fi
      - uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-Android
          path: export/**/*.apk
          if-no-files-found: warn